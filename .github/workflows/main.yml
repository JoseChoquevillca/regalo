name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Publish .NET Project
      run: dotnet publish -c Release -o release --nologo
      
    # Cambia la ruta base para que coincida con tu repo "regalo"
    - name: Change base-tag in index.html
      run: sed -i 's/<base href="\/" \/>/<base href="\/regalo\/" \/>/g' release/wwwroot/index.html
      
    # Evita que GitHub Pages ignore los archivos de Blazor
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll
      
    # Soluciona el error 404 al recargar la página
    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html
      
    - name: Commit wwwroot to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot
